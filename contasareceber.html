<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contas a Receber · Pé Na Cova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826; --ink-soft: #4b5768; --muted: #8a94a3;
    --paper: #eef1f6; --surface: #ffffff; --border: #dde2ea; --border-soft: #e9ecf2;
    --primary: #0e6b5c; --primary-hover: #0a5548; --primary-tint: #e4f2ee;
    --red: #b0362b; --red-tint: #fbe9e7; --amber: #b5750a; --amber-tint: #fdf3e0;
    --green: #1f8a4c; --green-tint: #e2f5ea;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,38,.04), 0 8px 24px -12px rgba(16,24,38,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; background: var(--paper); margin: 0; padding: 32px 20px 60px; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1000px; margin: 0 auto; }

  .page-head { margin-bottom: 26px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: var(--primary-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14px; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .stat .value { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .stat.warn .value { color: var(--amber); }
  .stat.ok .value { color: var(--green); }

  /* ---------- Tabela (desktop/tablet) ---------- */
  .filter-bar { margin-bottom: 16px; }
  .filter-input-wrap { position: relative; }
  .filter-input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
  #filtroCliente { width: 100%; padding: 12px 40px 12px 40px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); font-family: inherit; font-size: 14.5px; color: var(--ink); outline: none; transition: border-color .15s; }
  #filtroCliente:focus { border-color: var(--primary); }
  #filtroCliente::placeholder { color: var(--muted); }
  .filter-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 6px 8px; display: none; }
  .filter-clear:hover { color: var(--ink-soft); }
  .filter-clear.visible { display: block; }

  .table-container { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fc; color: var(--ink-soft); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border-soft); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfd; }
  td { padding: 12px 16px; font-size: 14px; vertical-align: middle; }
  td.centered { text-align: center; }

  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.pago { background: var(--green-tint); color: var(--green); }
  .badge.pendente { background: var(--amber-tint); color: var(--amber); }

  .actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .action-btn { padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink-soft); transition: .15s; }
  .action-btn.pay-btn:hover { background: var(--green-tint); color: var(--green); border-color: var(--green); }
  .action-btn.delete-btn:hover { background: var(--red-tint); color: var(--red); border-color: var(--red); }

  .empty-state, .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: .6; }

  .back { text-align: center; margin-top: 28px; }
  .back a { color: var(--ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .back a:hover { color: var(--primary); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: white; padding: 12px 20px; border-radius: 9px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .2s; z-index: 100; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red); }

  /* ---------- Cards (mobile) ---------- */
  .cards-container { display: none; }
  .fiado-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .fiado-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .fiado-card-cliente { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; word-break: break-word; }
  .fiado-card-data { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .fiado-card-valor { text-align: right; }
  .fiado-card-valor .amount { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .fiado-card-valor .amount.pendente-color { color: var(--amber); }
  .fiado-card-valor .amount.pago-color { color: var(--green); }
  .fiado-card-actions { display: flex; gap: 8px; }
  .fiado-card-actions .action-btn { flex: 1; padding: 12px 10px; font-size: 14px; border-radius: 9px; text-align: center; }
  .fiado-card .badge { margin-top: 6px; }

  /* ---------- Responsive breakpoint ---------- */
  @media (max-width: 640px) {
    body { padding: 20px 14px 48px; }
    .page-head h1 { font-size: 22px; }
    .page-head p { font-size: 13.5px; }

    .summary { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .summary .stat:nth-child(3) { grid-column: 1 / -1; }
    .stat { padding: 14px; }
    .stat .value { font-size: 20px; }

    .table-container { display: none; }
    .cards-container { display: block; }
    #filtroCliente { padding-top: 13px; padding-bottom: 13px; font-size: 16px; }
    .loading-state, .empty-state { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Financeiro</div>
    <h1>Contas a Receber</h1>
    <p>Acompanhe vendas consignadas e registre os pagamentos.</p>
  </div>

  <div class="summary">
    <div class="stat warn">
      <div class="label">Pendente</div>
      <div class="value mono" id="statPendente">R$ 0,00</div>
    </div>
    <div class="stat ok">
      <div class="label">Recebido</div>
      <div class="value mono" id="statPago">R$ 0,00</div>
    </div>
    <div class="stat">
      <div class="label">Contas em aberto</div>
      <div class="value" id="statQtd">0</div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="filtroCliente" placeholder="Buscar por nome do cliente..." autocomplete="off">
      <button class="filter-clear" id="btnLimparFiltro" title="Limpar busca">&times;</button>
    </div>
  </div>

  <!-- Tabela: visível em telas maiores -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Data</th>
          <th>Valor</th>
          <th>Status</th>
          <th style="text-align:center;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaFiados"></tbody>
    </table>
  </div>

  <!-- Cards: visível no celular -->
  <div class="cards-container" id="cardsFiados"></div>

  <div class="loading-state" id="loadingState">Carregando...</div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">✅</div>
    <div>Nenhum fiado pendente.</div>
  </div>

  <div class="back"><a href="painel.html">← Voltar ao painel</a></div>
</div>

<div id="toast"></div>

<script>
if (sessionStorage.getItem('isLoggedIn') !== 'true') {
  window.location.href = 'index.html';
}

const API_BASE = "/api";
const tabela = document.getElementById("tabelaFiados");
const cardsContainer = document.getElementById("cardsFiados");
const loadingState = document.getElementById("loadingState");
const emptyState = document.getElementById("emptyState");
const filtroInput = document.getElementById("filtroCliente");
const btnLimparFiltro = document.getElementById("btnLimparFiltro");

let todosFiados = [];

let toastTimer = null;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

function atualizarResumo(fiados) {
  const pendentes = fiados.filter(f => f.status !== "Pago");
  const pagos = fiados.filter(f => f.status === "Pago");
  const totalPendente = pendentes.reduce((s, f) => s + parseFloat(f.valor), 0);
  const totalPago = pagos.reduce((s, f) => s + parseFloat(f.valor), 0);

  document.getElementById("statPendente").textContent = totalPendente.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  document.getElementById("statPago").textContent = totalPago.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  document.getElementById("statQtd").textContent = pendentes.length;
}

async function carregarFiados() {
  loadingState.style.display = "block";
  emptyState.style.display = "none";
  tabela.innerHTML = "";
  cardsContainer.innerHTML = "";

  try {
    const res = await fetch(`${API_BASE}/contasareceber`);
    if (!res.ok) throw new Error("Erro ao buscar contas a receber");
    todosFiados = await res.json();

    loadingState.style.display = "none";
    atualizarResumo(todosFiados);
    renderFiados();
  } catch (err) {
    loadingState.style.display = "none";
    showToast(err.message, true);
  }
}

function renderFiados() {
  tabela.innerHTML = "";
  cardsContainer.innerHTML = "";

  const termo = filtroInput.value.trim().toLowerCase();
  const fiados = termo
    ? todosFiados.filter(f => f.cliente.toLowerCase().includes(termo))
    : todosFiados;

  btnLimparFiltro.classList.toggle('visible', termo.length > 0);

  if (todosFiados.length === 0) {
    emptyState.style.display = "block";
    emptyState.querySelector('.icon').textContent = '✅';
    emptyState.querySelector('div:last-child').textContent = 'Nenhum fiado pendente.';
    return;
  }

  if (fiados.length === 0) {
    emptyState.style.display = "block";
    emptyState.querySelector('.icon').textContent = '🔍';
    emptyState.querySelector('div:last-child').textContent = `Nenhum cliente encontrado para "${filtroInput.value.trim()}".`;
    return;
  }

  emptyState.style.display = "none";

  fiados.forEach((fiado) => {
      const pago = fiado.status === "Pago";
      const valorFmt = parseFloat(fiado.valor).toFixed(2);

      // Linha da tabela (desktop)
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${fiado.cliente}</td>
        <td class="mono">${fiado.data}</td>
        <td class="mono">R$ ${valorFmt}</td>
        <td><span class="badge ${pago ? 'pago' : 'pendente'}">${fiado.status}</span></td>
        <td>
          <div class="actions">
            ${!pago ? `<button class="action-btn pay-btn" data-action="pagar" data-id="${fiado.id}">Marcar pago</button>` : ""}
            <button class="action-btn delete-btn" data-action="remover" data-id="${fiado.id}">Remover</button>
          </div>
        </td>
      `;
      tabela.appendChild(row);

      // Card (mobile)
      const card = document.createElement("div");
      card.className = "fiado-card";
      card.innerHTML = `
        <div class="fiado-card-top">
          <div>
            <div class="fiado-card-cliente">${fiado.cliente}</div>
            <div class="fiado-card-data mono">${fiado.data}</div>
            <span class="badge ${pago ? 'pago' : 'pendente'}">${fiado.status}</span>
          </div>
          <div class="fiado-card-valor">
            <span class="amount mono ${pago ? 'pago-color' : 'pendente-color'}">R$ ${valorFmt}</span>
          </div>
        </div>
        <div class="fiado-card-actions">
          ${!pago ? `<button class="action-btn pay-btn" data-action="pagar" data-id="${fiado.id}">Marcar pago</button>` : ""}
          <button class="action-btn delete-btn" data-action="remover" data-id="${fiado.id}">Remover</button>
        </div>
      `;
      cardsContainer.appendChild(card);
    });
}

async function marcarPago(id) {
  try {
    const res = await fetch(`${API_BASE}/contasareceber`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status: "Pago" })
    });
    if (!res.ok) throw new Error("Erro ao atualizar status");
    showToast("Conta marcada como paga");
    carregarFiados();
  } catch (err) {
    showToast(err.message, true);
  }
}

async function remover(id) {
  if (!confirm("Deseja realmente remover esta conta?")) return;
  try {
    const res = await fetch(`${API_BASE}/contasareceber?id=${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("Erro ao remover conta");
    showToast("Conta removida");
    carregarFiados();
  } catch (err) {
    showToast(err.message, true);
  }
}

function handleActionClick(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  if (btn.dataset.action === 'pagar') marcarPago(id);
  if (btn.dataset.action === 'remover') remover(id);
}

tabela.addEventListener('click', handleActionClick);
cardsContainer.addEventListener('click', handleActionClick);

filtroInput.addEventListener('input', renderFiados);
btnLimparFiltro.addEventListener('click', () => {
  filtroInput.value = "";
  filtroInput.focus();
  renderFiados();
});

carregarFiados();
</script>
</body>
</html>
