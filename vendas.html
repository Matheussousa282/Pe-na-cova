<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Vendas · Pé Na Cova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826; --ink-soft: #4b5768; --muted: #8a94a3;
    --paper: #eef1f6; --surface: #ffffff; --border: #dde2ea; --border-soft: #e9ecf2;
    --primary: #0e6b5c; --primary-hover: #0a5548; --primary-tint: #e4f2ee;
    --red: #b0362b; --red-tint: #fbe9e7; --green: #1f8a4c;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,38,.04), 0 8px 24px -12px rgba(16,24,38,.12);
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; background: var(--paper); margin: 0; padding: 32px 20px 60px; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1050px; margin: 0 auto; }

  .page-head { margin-bottom: 22px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: var(--primary-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }
  .panel h2 { font-size: 14px; font-weight: 700; margin: 0 0 16px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }

  .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  input, select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; width: 100%; background: var(--surface); transition: .15s; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }

  button { font-family: inherit; cursor: pointer; }
  .btn { padding: 11px 18px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: .15s; white-space: nowrap; }
  .btn:hover { background: var(--primary-hover); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--border-soft); }
  .btn:active { transform: translateY(1px); }

  .table-container { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fc; color: var(--ink-soft); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border-soft); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfd; }
  td { padding: 12px 16px; font-size: 14px; }
  .empty-cart { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  .action-btn { padding: 6px 11px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink-soft); transition: .15s; }
  .action-btn:hover { background: var(--red-tint); color: var(--red); border-color: var(--red); }

  .total-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .total-bar .box { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px; padding: 14px 20px; box-shadow: var(--shadow); font-size: 17px; font-weight: 700; }
  .total-bar .box span { color: var(--primary); }

  .back { text-align: center; margin-top: 24px; }
  .back a { color: var(--ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .back a:hover { color: var(--primary); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(16,24,38,.5); align-items: center; justify-content: center; z-index: 200; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); padding: 24px; border-radius: 14px; width: 420px; max-width: 92%; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); }
  .modal h3 { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: white; padding: 12px 20px; border-radius: 9px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .2s; z-index: 300; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">PDV</div>
    <h1>Registrar Venda</h1>
    <p>Monte o carrinho do cliente e finalize a venda.</p>
  </div>

  <div class="panel">
    <h2>Cliente</h2>
    <div class="form-group">
      <div class="field">
        <label for="cliente">Cliente</label>
        <input list="listaClientes" id="cliente" placeholder="Digite o nome do cliente...">
        <datalist id="listaClientes"></datalist>
      </div>
      <button type="button" class="btn secondary" id="btnCadastrarCliente">+ Cadastrar cliente rápido</button>
    </div>
  </div>

  <div class="panel">
    <h2>Adicionar produto</h2>
    <div class="form-group">
      <div class="field">
        <label for="produto">Produto</label>
        <input list="listaProdutos" id="produto" placeholder="Digite o produto...">
        <datalist id="listaProdutos"></datalist>
      </div>
      <div class="field">
        <label for="tamanho">Tamanho</label>
        <select id="tamanho"><option value="">Selecione o produto primeiro</option></select>
      </div>
      <div class="field">
        <label for="quantidade">Quantidade <span style="color:var(--muted);font-weight:500;">(disponível: <span id="estoqueDisponivel">0</span>)</span></label>
        <input type="number" id="quantidade" min="1" value="1">
      </div>
      <button type="button" class="btn" id="btnAdicionar">Adicionar ao carrinho</button>
    </div>
  </div>

  <div class="table-container">
    <table id="tabelaVenda">
      <thead>
        <tr>
          <th>Produto</th>
          <th>Tamanho</th>
          <th>Quantidade</th>
          <th>Preço unitário</th>
          <th>Subtotal</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty-cart" id="emptyCart">O carrinho está vazio. Adicione produtos acima.</div>
  </div>

  <div class="total-bar">
    <div></div>
    <div class="box">Total: <span class="mono" id="totalVenda">R$ 0.00</span></div>
  </div>

  <div style="text-align:center;">
    <button class="btn" id="finalizarVenda" style="padding:14px 32px;font-size:15px;">Finalizar venda</button>
  </div>

  <div class="back"><a href="painel.html">← Voltar ao painel</a></div>
</div>

<div class="modal-overlay" id="modalCliente">
  <div class="modal">
    <h3>Cadastro rápido de cliente</h3>
    <div class="field"><label>Nome</label><input type="text" id="nomeCliente"></div>
    <div class="field"><label>Telefone</label><input type="text" id="telefoneCliente"></div>
    <div class="field"><label>Endereço</label><input type="text" id="enderecoCliente"></div>
    <div class="field"><label>Observação</label><input type="text" id="obsCliente"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelarCliente">Cancelar</button>
      <button class="btn" id="salvarCliente">Salvar cliente</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
if (sessionStorage.getItem('isLoggedIn') !== 'true') {
  window.location.href = 'index.html';
}

let estoque = [];
let clientes = [];
let carrinho = [];

const produtoInput = document.getElementById("produto");
const tamanhoSelect = document.getElementById("tamanho");
const qtdInput = document.getElementById("quantidade");
const estoqueDisponivelSpan = document.getElementById("estoqueDisponivel");
const tabela = document.getElementById("tabelaVenda").querySelector("tbody");
const emptyCart = document.getElementById("emptyCart");
const totalVenda = document.getElementById("totalVenda");
const clienteInput = document.getElementById("cliente");
const listaClientes = document.getElementById("listaClientes");
const listaProdutos = document.getElementById("listaProdutos");

const API_BASE = "/api";

let toastTimer = null;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

async function fetchClientes() {
  const res = await fetch(`${API_BASE}/clientes`);
  clientes = await res.json();
  listaClientes.innerHTML = "";
  clientes.forEach(c => {
    const opt = document.createElement("option");
    opt.value = `${c.nome} - ${c.telefone}`;
    listaClientes.appendChild(opt);
  });
}

async function fetchProdutos() {
  const res = await fetch(`${API_BASE}/produtos`);
  estoque = await res.json();
  listaProdutos.innerHTML = "";
  const descricoes = [...new Set(estoque.map(p => p.descricao))];
  descricoes.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    listaProdutos.appendChild(opt);
  });
}

produtoInput.addEventListener("change", () => {
  const prod = produtoInput.value;
  tamanhoSelect.innerHTML = "<option value=''>Selecione o tamanho</option>";
  if (!prod) return;
  const tamanhos = estoque.filter(p => p.descricao === prod).map(p => p.tamanho);
  tamanhos.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    tamanhoSelect.appendChild(opt);
  });
});

tamanhoSelect.addEventListener("change", () => {
  const prodEscolhido = produtoInput.value;
  const tamanhoEscolhido = tamanhoSelect.value;
  const prod = estoque.find(p => p.descricao === prodEscolhido && p.tamanho === tamanhoEscolhido);
  estoqueDisponivelSpan.textContent = prod ? prod.quantidade : 0;
});

document.getElementById("btnAdicionar").addEventListener("click", () => {
  const prodEscolhido = produtoInput.value;
  const tamanhoEscolhido = tamanhoSelect.value;
  const qtd = parseInt(qtdInput.value);
  if (!prodEscolhido || !tamanhoEscolhido) return showToast("Selecione produto e tamanho.", true);
  const prod = estoque.find(p => p.descricao === prodEscolhido && p.tamanho === tamanhoEscolhido);
  if (!prod) return showToast("Produto não encontrado.", true);
  if (!qtd || qtd < 1) return showToast("Informe uma quantidade válida.", true);
  if (qtd > prod.quantidade) return showToast("Quantidade maior que o estoque disponível.", true);

  carrinho.push({ produto_id: prod.id, descricao: prod.descricao, tamanho: prod.tamanho, quantidade: qtd, preco: parseFloat(prod.preco), subtotal: qtd * parseFloat(prod.preco) });
  prod.quantidade -= qtd;
  renderTabela();
  qtdInput.value = 1;
  estoqueDisponivelSpan.textContent = prod.quantidade;
  showToast("Produto adicionado ao carrinho");
});

function renderTabela() {
  tabela.innerHTML = "";
  let total = 0;
  emptyCart.style.display = carrinho.length === 0 ? 'block' : 'none';

  carrinho.forEach((item, idx) => {
    total += item.subtotal;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.descricao}</td>
      <td>${item.tamanho}</td>
      <td class="mono">${item.quantidade}</td>
      <td class="mono">R$ ${item.preco.toFixed(2)}</td>
      <td class="mono">R$ ${item.subtotal.toFixed(2)}</td>
      <td><button class="action-btn" data-idx="${idx}">Remover</button></td>
    `;
    tabela.appendChild(tr);
  });
  totalVenda.textContent = "R$ " + total.toFixed(2);
}

tabela.addEventListener('click', e => {
  const btn = e.target.closest('button[data-idx]');
  if (btn) removerItem(Number(btn.dataset.idx));
});

function removerItem(idx) {
  let item = carrinho[idx];
  const prod = estoque.find(p => p.id === item.produto_id);
  if (prod) prod.quantidade += item.quantidade;
  carrinho.splice(idx, 1);
  renderTabela();
  showToast("Item removido do carrinho");
}

document.getElementById("finalizarVenda").addEventListener("click", () => {
  if (carrinho.length === 0) return showToast("O carrinho está vazio.", true);
  const clienteTexto = clienteInput.value.trim();
  if (!clienteTexto) return showToast("Selecione ou digite o cliente.", true);
  const cliente = clientes.find(c => `${c.nome} - ${c.telefone}` === clienteTexto);
  if (!cliente) return showToast("Cliente não encontrado.", true);

  const total = carrinho.reduce((acc, i) => acc + i.subtotal, 0);
  const vendaAtual = { cliente: cliente.nome, cliente_id: cliente.id, total, itens: carrinho };
  localStorage.setItem("vendaAtual", JSON.stringify(vendaAtual));
  localStorage.setItem("carrinhoAtual", JSON.stringify(carrinho));
  window.location.href = "recebimento.html";
});

const modalCliente = document.getElementById("modalCliente");
document.getElementById("btnCadastrarCliente").addEventListener("click", () => modalCliente.classList.add("show"));
document.getElementById("cancelarCliente").addEventListener("click", () => modalCliente.classList.remove("show"));

document.getElementById("salvarCliente").addEventListener("click", async () => {
  const nome = document.getElementById("nomeCliente").value.trim();
  const telefone = document.getElementById("telefoneCliente").value.trim();
  const endereco = document.getElementById("enderecoCliente").value.trim();
  const obs = document.getElementById("obsCliente").value.trim();
  if (!nome || !telefone) return showToast("Nome e telefone são obrigatórios.", true);

  try {
    const res = await fetch(`${API_BASE}/clientes`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome, telefone, endereco, obs }) });
    if (!res.ok) throw new Error("Erro ao cadastrar cliente");
    modalCliente.classList.remove("show");
    document.getElementById("nomeCliente").value = "";
    document.getElementById("telefoneCliente").value = "";
    document.getElementById("enderecoCliente").value = "";
    document.getElementById("obsCliente").value = "";
    await fetchClientes();
    showToast("Cliente cadastrado com sucesso!");
  } catch (err) {
    showToast("Erro ao cadastrar cliente.", true);
  }
});

fetchClientes();
fetchProdutos();
</script>

</body>
</html>
