<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Pé Na Cova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826;
    --ink-soft: #4b5768;
    --muted: #8a94a3;
    --primary: #0e6b5c;
    --primary-hover: #0a5548;
    --primary-tint: #e4f2ee;
    --red: #b0362b;
    --red-tint: #fbe9e7;
    --border: #dde2ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 500px at 15% 10%, #12806d 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 90%, #0a4a40 0%, transparent 55%),
      #0d3d34;
    padding: 20px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px 32px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.45);
  }

  .brand {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  h1 { font-size: 21px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 4px; }
  .subtitle { font-size: 13.5px; color: var(--muted); margin-bottom: 28px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 12px 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    font-size: 14.5px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-tint);
  }

  button.submit {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .05s;
    font-family: inherit;
  }
  button.submit:hover { background: var(--primary-hover); }
  button.submit:active { transform: translateY(1px); }

  .alert {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--red-tint);
    color: var(--red);
    font-size: 13.5px;
    font-weight: 600;
    display: none;
    text-align: center;
  }

  .link {
    margin-top: 22px;
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
  }
  .link a { color: var(--primary); text-decoration: none; font-weight: 700; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">PC</div>
  <h1>Bem-vindo de volta</h1>
  <p class="subtitle">Entre com sua conta para acessar o painel Pé Na Cova.</p>

  <div class="field">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" autocomplete="username">
  </div>
  <div class="field">
    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password">
  </div>

  <button class="submit" onclick="login()">Entrar</button>
  <div class="alert" id="alertMsg">Usuário ou senha incorretos.</div>

  <div class="link">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></div>
</div>

<script>
function login() {
  const user = document.getElementById("usuario").value.trim();
  const pass = document.getElementById("senha").value.trim();
  const alertMsg = document.getElementById("alertMsg");

  if (user === "Pe na cova" && pass === "2634") {
    sessionStorage.setItem("isLoggedIn", "true");
    alertMsg.style.display = "none";
    window.location.href = "painel.html";
  } else {
    alertMsg.style.display = "block";
  }
}

document.getElementById("senha").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
