<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recebimento · Pé Na Cova</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826; --ink-soft: #4b5768; --muted: #8a94a3;
    --paper: #eef1f6; --surface: #ffffff; --border: #dde2ea; --border-soft: #e9ecf2;
    --primary: #0e6b5c; --primary-hover: #0a5548; --primary-tint: #e4f2ee;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,38,.04), 0 8px 24px -12px rgba(16,24,38,.12);
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; background: var(--paper); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--ink); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  .card { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border-soft); }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: var(--primary-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  h2 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .subtitle { font-size: 13.5px; color: var(--muted); margin-bottom: 24px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; background: var(--surface); }
  .field input:disabled { background: #f6f8fb; color: var(--ink-soft); }
  .field select:focus, .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }

  .desconto-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .toggle-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink-soft); font-family: inherit; transition: .15s; }
  .toggle-btn:hover { background: var(--border-soft); }
  .toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .resumo-valores { margin: -4px 0 20px; }
  .resumo-linha { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 14px; color: var(--ink-soft); }
  .resumo-linha.total-final { padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--border-soft); font-size: 22px; font-weight: 800; color: var(--primary); }
  .resumo-linha .valor { font-family: "JetBrains Mono", ui-monospace, monospace; }

  .btn { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 9px; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: .15s; font-family: inherit; }
  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(1px); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: white; padding: 12px 20px; border-radius: 9px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .2s; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #b0362b; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Checkout</div>
  <h2>Finalizar recebimento</h2>
  <p class="subtitle">Confirme a forma de pagamento para concluir a venda.</p>

  <div class="field">
    <label>Cliente</label>
    <input type="text" id="cliente" disabled>
  </div>

  <div class="field">
    <label for="desconto">Desconto</label>
    <div class="desconto-toggle">
      <button type="button" class="toggle-btn active" id="btnModoReais" data-modo="reais">R$</button>
      <button type="button" class="toggle-btn" id="btnModoPercentual" data-modo="percentual">%</button>
    </div>
    <input type="number" id="desconto" step="0.01" min="0" value="0" inputmode="decimal">
  </div>

  <div class="resumo-valores">
    <div class="resumo-linha">
      <span>Subtotal</span>
      <span class="valor" id="valorSubtotal">R$ 0,00</span>
    </div>
    <div class="resumo-linha">
      <span id="labelDescontoResumo">Desconto</span>
      <span class="valor" id="valorDescontoResumo">R$ 0,00</span>
    </div>
    <div class="resumo-linha total-final">
      <span>Total a cobrar</span>
      <span class="valor" id="valorDestaque">R$ 0,00</span>
    </div>
  </div>

  <div class="field">
    <label for="formaPagamento">Forma de pagamento</label>
    <select id="formaPagamento">
      <option value="dinheiro">Dinheiro</option>
      <option value="pix">Pix</option>
      <option value="debito">Cartão de débito</option>
      <option value="credito">Cartão de crédito</option>
      <option value="fiado">Consignado</option>
    </select>
  </div>

  <button class="btn" onclick="finalizarRecebimento()">Finalizar</button>
</div>

<div id="toast"></div>

<script>
if (sessionStorage.getItem('isLoggedIn') !== 'true') {
  window.location.href = 'index.html';
}

let toastTimer = null;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

function fmtMoeda(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

const { jsPDF } = window.jspdf;

let venda = JSON.parse(localStorage.getItem("vendaAtual"));
let carrinho = JSON.parse(localStorage.getItem("carrinhoAtual")) || [];

const descontoInput = document.getElementById("desconto");
const btnModoReais = document.getElementById("btnModoReais");
const btnModoPercentual = document.getElementById("btnModoPercentual");
let descontoModo = "reais"; // "reais" | "percentual"

document.getElementById("cliente").value = venda?.cliente || "";

function totalComDesconto() {
  const subtotal = venda?.total ?? 0;
  let valorDigitado = parseFloat(descontoInput.value) || 0;
  if (valorDigitado < 0) valorDigitado = 0;

  let desconto;
  if (descontoModo === "percentual") {
    if (valorDigitado > 100) valorDigitado = 100;
    desconto = subtotal * (valorDigitado / 100);
  } else {
    if (valorDigitado > subtotal) valorDigitado = subtotal;
    desconto = valorDigitado;
  }
  return { subtotal, desconto, totalFinal: subtotal - desconto };
}

function atualizarResumoValores() {
  const { subtotal, desconto, totalFinal } = totalComDesconto();
  document.getElementById("valorSubtotal").textContent = fmtMoeda(subtotal);
  document.getElementById("valorDescontoResumo").textContent = fmtMoeda(desconto);
  document.getElementById("valorDestaque").textContent = fmtMoeda(totalFinal);

  const label = document.getElementById("labelDescontoResumo");
  if (descontoModo === "percentual") {
    const percent = parseFloat(descontoInput.value) || 0;
    label.textContent = `Desconto (${percent.toFixed(1)}%)`;
  } else {
    label.textContent = "Desconto";
  }
}

function setModoDesconto(novoModo) {
  if (novoModo === descontoModo) return;
  const subtotal = venda?.total ?? 0;
  const valorAtual = parseFloat(descontoInput.value) || 0;

  // Converte o valor digitado para o novo modo, sem perder o que já
  // estava calculado (ex.: 10% de R$200 vira R$20,00 ao trocar pra R$).
  if (novoModo === "percentual") {
    const percent = subtotal > 0 ? (valorAtual / subtotal) * 100 : 0;
    descontoInput.value = Math.min(percent, 100).toFixed(2);
    descontoInput.max = 100;
  } else {
    const reais = subtotal * (Math.min(valorAtual, 100) / 100);
    descontoInput.value = reais.toFixed(2);
    descontoInput.max = subtotal;
  }

  descontoModo = novoModo;
  btnModoReais.classList.toggle("active", novoModo === "reais");
  btnModoPercentual.classList.toggle("active", novoModo === "percentual");
  atualizarResumoValores();
}

btnModoReais.addEventListener("click", () => setModoDesconto("reais"));
btnModoPercentual.addEventListener("click", () => setModoDesconto("percentual"));
descontoInput.max = venda?.total ?? 0;

descontoInput.addEventListener("input", atualizarResumoValores);
atualizarResumoValores();

async function finalizarRecebimento() {
  if (!venda) { showToast("Nenhuma venda em andamento.", true); return; }

  const forma = document.getElementById("formaPagamento").value;
  const { desconto, totalFinal } = totalComDesconto();

  try {
    const itensAPI = carrinho.map(item => ({
      produto_id: item.produto_id,
      quantidade: item.quantidade,
      preco: item.preco,
      tamanho: item.tamanho
    }));

    const res = await fetch("/api/recebimentos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente_id: venda.cliente_id,
        itens: itensAPI,
        forma_pagamento: forma,
        total: venda.total,
        desconto: desconto
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erro ao finalizar venda");

    showToast("Venda finalizada com sucesso!");
    gerarPDF(desconto, totalFinal);

    localStorage.removeItem("vendaAtual");
    localStorage.removeItem("carrinhoAtual");
  } catch (err) {
    showToast("Erro: " + err.message, true);
  }
}

function gerarPDF(desconto, totalFinal) {
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.setTextColor(14, 107, 92);
  doc.text("Nota de Venda", 105, 20, { align: "center" });

  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text(`Cliente: ${venda.cliente}`, 20, 35);
  doc.text(`Data: ${new Date().toLocaleDateString("pt-BR")}`, 20, 43);

  let startY = 55;
  doc.setFont(undefined, "bold");
  doc.text("Produto", 20, startY);
  doc.text("Tamanho", 70, startY);
  doc.text("Qtd", 100, startY);
  doc.text("Preço", 120, startY);
  doc.text("Subtotal", 150, startY);
  doc.setFont(undefined, "normal");

  startY += 7;
  carrinho.forEach(item => {
    doc.text(item.descricao, 20, startY);
    doc.text(item.tamanho, 70, startY);
    doc.text(item.quantidade.toString(), 100, startY);
    doc.text("R$ " + item.preco.toFixed(2), 120, startY);
    doc.text("R$ " + item.subtotal.toFixed(2), 150, startY);
    startY += 7;
  });

  startY += 6;
  doc.setFont(undefined, "normal");
  doc.text(`Subtotal: R$ ${venda.total.toFixed(2)}`, 150, startY, { align: "left" });

  if (desconto > 0) {
    startY += 7;
    doc.text(`Desconto: R$ ${desconto.toFixed(2)}`, 150, startY, { align: "left" });
  }

  startY += 10;
  doc.setFont(undefined, "bold");
  doc.text(`Total: R$ ${totalFinal.toFixed(2)}`, 150, startY, { align: "left" });

  doc.save(`nota_${venda.cliente}_${Date.now()}.pdf`);

  setTimeout(() => window.location.href = "vendas.html", 600);
}
</script>

</body>
</html>
