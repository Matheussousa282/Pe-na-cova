<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios · Pé Na Cova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826; --ink-soft: #4b5768; --muted: #8a94a3;
    --paper: #eef1f6; --surface: #ffffff; --border: #dde2ea; --border-soft: #e9ecf2;
    --primary: #0e6b5c; --primary-hover: #0a5548; --primary-tint: #e4f2ee;
    --red: #b0362b; --red-tint: #fbe9e7;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,38,.04), 0 8px 24px -12px rgba(16,24,38,.12);
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; background: var(--paper); margin: 0; padding: 32px 20px 60px; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .page-head { margin-bottom: 22px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: var(--primary-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14px; }

  .filters { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); align-items: center; }
  .filters input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; }
  .filters input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  button { font-family: inherit; cursor: pointer; }
  .btn { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 13.5px; transition: .15s; }
  .btn:hover { background: var(--primary-hover); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--border-soft); }

  .table-container { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fc; color: var(--ink-soft); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border-soft); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfd; }
  td { padding: 12px 16px; font-size: 13.5px; }

  .no-data { text-align: center; padding: 50px 20px; color: var(--muted); }

  .summary-bar { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  .summary-bar .box { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 18px; box-shadow: var(--shadow); font-size: 14px; }
  .summary-bar .box b { color: var(--primary); }

  .back { text-align: center; margin-top: 28px; }
  .back a { color: var(--ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .back a:hover { color: var(--primary); }

  @media print {
    .filters, .back { display: none; }
    body { background: white; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Relatórios</div>
    <h1>Relatórios Avançados</h1>
    <p>Analise vendas por período, cliente ou produto.</p>
  </div>

  <div class="filters">
    <input type="date" id="dataInicio">
    <input type="date" id="dataFim">
    <input type="text" id="filtroCliente" placeholder="Cliente">
    <input type="text" id="filtroProduto" placeholder="Produto">
    <button class="btn" id="btnGerar">Gerar relatório</button>
    <button class="btn secondary" id="btnLimpar">Limpar</button>
    <button class="btn secondary" id="btnImprimir">Imprimir</button>
  </div>

  <div class="table-container">
    <table id="tabelaRelatorios">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente</th>
          <th>Desconto</th>
          <th>Produto</th>
          <th>Tamanho</th>
          <th>Quantidade</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="no-data" id="noData" style="display:none;">Nenhuma venda encontrada com os filtros selecionados.</div>
  </div>

  <div class="summary-bar">
    <div class="box">Total geral: <b class="mono">R$ <span id="totalGeral">0.00</span></b></div>
    <div class="box">Produtos vendidos: <b id="totalProdutos">0</b></div>
  </div>

  <div class="back"><a href="painel.html">← Voltar ao painel</a></div>
</div>

<script>
if (sessionStorage.getItem('isLoggedIn') !== 'true') {
  window.location.href = 'index.html';
}

let vendas = [];

async function buscarVendas() {
  const inicio = document.getElementById("dataInicio").value;
  const fim = document.getElementById("dataFim").value;
  const cliente = document.getElementById("filtroCliente").value;
  const produto = document.getElementById("filtroProduto").value;

  const params = new URLSearchParams({
    dataInicio: inicio || '',
    dataFim: fim || '',
    cliente: cliente || '',
    produto: produto || ''
  });

  try {
    const res = await fetch(`/api/relatorio?${params.toString()}`);
    if (!res.ok) throw new Error("Erro ao buscar vendas do banco");
    vendas = await res.json();
    gerarRelatorio();
  } catch (err) {
    alert(err.message);
  }
}

function gerarRelatorio() {
  const tbody = document.getElementById("tabelaRelatorios").querySelector("tbody");
  tbody.innerHTML = "";

  let totalGeral = 0;
  let totalProdutos = 0;

  if (!vendas.length) {
    document.getElementById("noData").style.display = "block";
    document.getElementById("totalGeral").textContent = "0.00";
    document.getElementById("totalProdutos").textContent = "0";
    return;
  } else {
    document.getElementById("noData").style.display = "none";
  }

  vendas.forEach(venda => {
    (venda.produtos || []).forEach(p => {
      totalGeral += p.subtotal || 0;
      totalProdutos += p.quantidade || 0;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="mono">${venda.data || '-'}</td>
        <td>${venda.cliente || '-'}</td>
        <td class="mono">${venda.desconto.toFixed(2)}%</td>
        <td>${p.descricao || '-'}</td>
        <td>${p.tamanho || '-'}</td>
        <td class="mono">${p.quantidade || 0}</td>
        <td class="mono">R$ ${p.subtotal ? p.subtotal.toFixed(2) : '0.00'}</td>
      `;
      tbody.appendChild(tr);
    });
  });

  document.getElementById("totalGeral").textContent = totalGeral.toFixed(2);
  document.getElementById("totalProdutos").textContent = totalProdutos;
}

document.getElementById("btnGerar").addEventListener("click", buscarVendas);
document.getElementById("btnLimpar").addEventListener("click", () => {
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  document.getElementById("filtroCliente").value = "";
  document.getElementById("filtroProduto").value = "";
  buscarVendas();
});
document.getElementById("btnImprimir").addEventListener("click", () => window.print());

buscarVendas();
</script>
</body>
</html>
