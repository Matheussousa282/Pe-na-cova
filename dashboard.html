<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Vendas · Pé Na Cova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101826; --ink-soft: #4b5768; --muted: #8a94a3;
    --paper: #eef1f6; --surface: #ffffff; --border: #dde2ea; --border-soft: #e9ecf2;
    --primary: #0e6b5c; --primary-hover: #0a5548; --primary-tint: #e4f2ee;
    --red: #b0362b; --red-tint: #fbe9e7; --amber: #b5750a; --amber-tint: #fdf3e0;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,38,.04), 0 8px 24px -12px rgba(16,24,38,.12);
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, Segoe UI, Arial, sans-serif; background: var(--paper); margin: 0; padding: 32px 20px 60px; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .page-head { margin-bottom: 22px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: var(--primary-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14px; }

  .filters { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
  .filters input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; }
  .filters input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  button { font-family: inherit; cursor: pointer; }
  .btn { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 13.5px; transition: .15s; }
  .btn:hover { background: var(--primary-hover); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--border-soft); }

  .table-container { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fc; color: var(--ink-soft); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border-soft); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfd; }
  tbody tr.resumo-row { background: var(--primary-tint) !important; font-weight: 700; }
  td { padding: 12px 16px; font-size: 13.5px; vertical-align: middle; }
  td.mono { font-family: "JetBrains Mono", monospace; }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .action-btn { padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--ink-soft); transition: .15s; }
  .action-btn.troca-btn:hover { background: var(--amber-tint); color: var(--amber); border-color: var(--amber); }
  .action-btn.remove-btn:hover { background: var(--red-tint); color: var(--red); border-color: var(--red); }

  .total-bar { display: flex; justify-content: flex-end; margin-top: 14px; }
  .total-bar .box { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }
  .total-bar .box span { color: var(--primary); }

  .back { text-align: center; margin-top: 28px; }
  .back a { color: var(--ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .back a:hover { color: var(--primary); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(16,24,38,.5); align-items: center; justify-content: center; z-index: 200; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); padding: 24px; border-radius: 14px; width: 420px; max-width: 92%; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); }
  .modal h3 { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .modal label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  .modal select, .modal input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; margin-bottom: 14px; }
  .modal select:focus, .modal input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: white; padding: 12px 20px; border-radius: 9px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .2s; z-index: 300; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Vendas</div>
    <h1>Controle de Vendas</h1>
    <p>Histórico de vendas, trocas e cancelamentos.</p>
  </div>

  <div class="filters">
    <input type="date" id="filtroData">
    <input type="text" id="filtroCliente" placeholder="Filtrar por cliente">
    <input type="text" id="filtroProduto" placeholder="Filtrar por produto">
    <button class="btn" id="btnFiltrar">Filtrar</button>
    <button class="btn secondary" id="btnLimpar">Limpar</button>
  </div>

  <div class="table-container">
    <table id="tabelaVendas">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente</th>
          <th>Produtos</th>
          <th>Total</th>
          <th>Desconto</th>
          <th>Total final</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="total-bar"><div class="box">Total geral: <span class="mono" id="totalGeral">R$ 0.00</span></div></div>

  <div class="back"><a href="painel.html">← Voltar ao painel</a></div>
</div>

<div class="modal-overlay" id="modalTroca">
  <div class="modal">
    <h3>Trocar itens da venda</h3>
    <label>Produto</label>
    <select id="produtoSelect"></select>
    <label>Quantidade</label>
    <input type="number" id="novaQtd" min="1">
    <label>Valor</label>
    <input type="number" id="novoValor" step="0.01">
    <div class="modal-actions">
      <button class="btn secondary" onclick="fecharTroca()">Cancelar</button>
      <button class="btn" onclick="confirmarTroca()">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
if (sessionStorage.getItem('isLoggedIn') !== 'true') {
  window.location.href = 'index.html';
}

let toastTimer = null;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

let vendas = [];
let vendaTrocaId = null;
let itensVendaAtual = [];

async function confirmarTroca() {
  const index = document.getElementById("produtoSelect").value;
  if (index === "") { showToast("Selecione um produto", true); return; }

  const itemOriginal = itensVendaAtual[index];
  const quantidade = Number(document.getElementById("novaQtd").value);
  const preco = Number(document.getElementById("novoValor").value);

  if (!quantidade || !preco) { showToast("Preencha quantidade e valor", true); return; }

  try {
    const res = await fetch("/api/trocarItensVenda", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        venda_id: vendaTrocaId,
        itens: [{ produto_id: itemOriginal.produto_id, tamanho: itemOriginal.tamanho, quantidade, preco }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erro na troca");
    showToast("Itens trocados com sucesso");
    fecharTroca();
    buscarVendas();
  } catch (err) {
    showToast(err.message, true);
  }
}

async function buscarVendas() {
  try {
    const res = await fetch("/api/relatorio");
    if (!res.ok) throw new Error("Erro ao buscar vendas do servidor");
    vendas = await res.json();
    renderTabela(vendas);
  } catch (err) {
    showToast(err.message, true);
  }
}

function renderTabela(lista) {
  const tbody = document.getElementById("tabelaVendas").querySelector("tbody");
  tbody.innerHTML = "";

  let totalGeral = 0;
  const clientesTotais = {};

  lista.forEach(venda => {
    const total = parseFloat(venda.total) || 0;
    const desconto = parseFloat(venda.desconto) || 0;
    const totalFinal = total - desconto;
    totalGeral += totalFinal;

    if (!clientesTotais[venda.cliente]) clientesTotais[venda.cliente] = { total: 0, desconto: 0 };
    clientesTotais[venda.cliente].total += totalFinal;
    clientesTotais[venda.cliente].desconto += desconto;

    const produtosStr = (venda.produtos || []).map(p => `${p.descricao} (${p.tamanho}) x${p.quantidade}`).join(", ");

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="mono">${venda.data}</td>
      <td>${venda.cliente}</td>
      <td>${produtosStr}</td>
      <td class="mono">R$ ${total.toFixed(2)}</td>
      <td class="mono">R$ ${desconto.toFixed(2)}</td>
      <td class="mono">R$ ${totalFinal.toFixed(2)}</td>
      <td>
        <div class="actions">
          <button class="action-btn troca-btn" data-action="trocar">Trocar itens</button>
          <button class="action-btn remove-btn" data-action="cancelar" data-id="${venda.venda_id}">Cancelar</button>
        </div>
      </td>
    `;
    tr.querySelector('[data-action="trocar"]').addEventListener('click', () => abrirTroca(venda));
    tbody.appendChild(tr);
  });

  if (Object.keys(clientesTotais).length > 0) {
    const resumoHeader = document.createElement("tr");
    resumoHeader.innerHTML = `<td colspan="7" style="background:#f7f9fc;font-weight:700;text-align:center;color:var(--ink-soft);">Resumo por cliente</td>`;
    tbody.appendChild(resumoHeader);

    Object.keys(clientesTotais).forEach(cliente => {
      const tr = document.createElement("tr");
      tr.className = "resumo-row";
      tr.innerHTML = `
        <td>—</td>
        <td>${cliente}</td>
        <td>—</td>
        <td class="mono">R$ ${(clientesTotais[cliente].total + clientesTotais[cliente].desconto).toFixed(2)}</td>
        <td class="mono">R$ ${clientesTotais[cliente].desconto.toFixed(2)}</td>
        <td class="mono">R$ ${clientesTotais[cliente].total.toFixed(2)}</td>
        <td>—</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById("totalGeral").textContent = "R$ " + totalGeral.toFixed(2);
}

document.getElementById("btnFiltrar").addEventListener("click", () => {
  const data = document.getElementById("filtroData").value;
  const cliente = document.getElementById("filtroCliente").value.toLowerCase();
  const produto = document.getElementById("filtroProduto").value.toLowerCase();

  const filtradas = vendas.filter(v => {
    let cond = true;
    if (data) cond = cond && v.data === data;
    if (cliente) cond = cond && v.cliente.toLowerCase().includes(cliente);
    if (produto) cond = cond && (v.produtos || []).some(p => p.descricao.toLowerCase().includes(produto));
    return cond;
  });
  renderTabela(filtradas);
});

document.getElementById("btnLimpar").addEventListener("click", () => {
  document.getElementById("filtroData").value = "";
  document.getElementById("filtroCliente").value = "";
  document.getElementById("filtroProduto").value = "";
  renderTabela(vendas);
});

async function cancelarVenda(vendaId) {
  if (!vendaId) { showToast("ID da venda inválido", true); return; }
  if (!confirm("Deseja realmente cancelar esta venda?")) return;

  try {
    const res = await fetch("/api/cancelarVenda", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ venda_id: vendaId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showToast("Venda cancelada com sucesso");
    buscarVendas();
  } catch (err) {
    showToast(err.message, true);
  }
}

document.getElementById("tabelaVendas").addEventListener('click', e => {
  const btn = e.target.closest('button[data-action="cancelar"]');
  if (btn) cancelarVenda(Number(btn.dataset.id));
});

document.getElementById("produtoSelect").addEventListener("change", function () {
  const index = this.value;
  if (index === "") return;
  const item = itensVendaAtual[index];
  document.getElementById("novaQtd").value = item.quantidade;
  document.getElementById("novoValor").value = item.preco;
});

function abrirTroca(venda) {
  vendaTrocaId = venda.venda_id;
  itensVendaAtual = venda.produtos || [];

  const select = document.getElementById("produtoSelect");
  select.innerHTML = `<option value="">Selecione o produto</option>`;
  itensVendaAtual.forEach((p, index) => {
    const opt = document.createElement("option");
    opt.value = index;
    opt.textContent = `${p.descricao} (${p.tamanho})`;
    select.appendChild(opt);
  });

  document.getElementById("novaQtd").value = "";
  document.getElementById("novoValor").value = "";
  document.getElementById("modalTroca").classList.add("show");
}

function fecharTroca() {
  vendaTrocaId = null;
  itensVendaAtual = [];
  document.getElementById("produtoSelect").innerHTML = "";
  document.getElementById("modalTroca").classList.remove("show");
}

buscarVendas();
</script>
</body>
</html>
